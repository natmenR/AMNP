<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misión · Sobrevive en el espacio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="juego.css">
</head>
<body class="pantalla-juego">
  <div class="stars lejos" aria-hidden="true"></div>
  <div class="stars cerca" aria-hidden="true"></div>

  <main class="mision">
    <header class="hud">
      <div class="hud-top">
        <img id="astro" class="astro-mini" src="assets/astronauta.png" alt="" width="500" height="660">
        <div class="dia-caja">
          <p class="dia-texto"><span id="dia">Día 1</span><span id="dia-total"></span></p>
          <div class="progreso" aria-hidden="true"><div id="progreso" class="progreso-relleno"></div></div>
        </div>
        <a class="salir" href="index.html">Salir</a>
      </div>

      <ul class="medidores">
        <li data-r="e" class="medidor energia">
          <span class="nombre">Energía</span><span class="valor">70</span>
          <div class="barra" role="progressbar" aria-label="Energía" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"><div class="relleno"></div></div>
        </li>
        <li data-r="o" class="medidor oxigeno">
          <span class="nombre">Oxígeno</span><span class="valor">70</span>
          <div class="barra" role="progressbar" aria-label="Oxígeno" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"><div class="relleno"></div></div>
        </li>
        <li data-r="s" class="medidor escudo">
          <span class="nombre">Escudo</span><span class="valor">70</span>
          <div class="barra" role="progressbar" aria-label="Escudo" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"><div class="relleno"></div></div>
        </li>
      </ul>
    </header>

    <section id="escena" aria-live="polite"></section>
  </main>

  <script src="eventos.js"></script>
  <script src="juego.js"></script>
</body>
</html>
