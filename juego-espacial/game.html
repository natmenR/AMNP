<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Survive in Space · Mission</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/letter.css">
  <link rel="stylesheet" href="css/alert.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/minigames.css">
</head>
<body class="game-page">
  <div class="cockpit" aria-hidden="true"></div>

  <div class="alert-lights" aria-hidden="true"></div>
  <div class="alert-lamp left" aria-hidden="true"></div>
  <div class="alert-lamp right" aria-hidden="true"></div>

  <main class="mission">
    <header class="hud">
      <div class="hud-top">
        <div class="round-box">
          <p class="round-label"><span data-round-label>Round 1 of 10</span><span class="alert-chip" role="status">&#9888; ALERT</span></p>
          <div class="progress" aria-hidden="true"><div class="progress-fill" data-round-progress></div></div>
        </div>
        <button id="sound-toggle" class="sound-btn" type="button" aria-pressed="true">Sound: on</button>
        <a class="exit-link" href="index.html">Exit</a>
      </div>

      <ul class="meters">
        <li class="meter energy" data-resource="energy">
          <span class="name">Energy</span><span class="value">70%</span>
          <div class="bar" role="progressbar" aria-label="Energy" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"><div class="fill"></div></div>
        </li>
        <li class="meter life" data-resource="lifeSupport">
          <span class="name">Life Support</span><span class="value">70%</span>
          <div class="bar" role="progressbar" aria-label="Life Support" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"><div class="fill"></div></div>
        </li>
        <li class="meter shield" data-resource="shielding">
          <span class="name">Shielding</span><span class="value">70%</span>
          <div class="bar" role="progressbar" aria-label="Shelter integrity and shielding" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70"><div class="fill"></div></div>
        </li>
      </ul>
    </header>

    <section id="stage" class="stage"></section>
  </main>

  <img id="astronaut" class="astronaut" src="assets/astronauta.png" alt="" width="500" height="660">

  <script src="dist/game-page.js" defer></script>
</body>
</html>
